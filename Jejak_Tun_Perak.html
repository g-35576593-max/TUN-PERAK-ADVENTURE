<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jejak Tun Perak • Dunia Blok</title><style>*{box-sizing:border-box}body{margin:0;background:#8acbcd;font:16px 'Trebuchet MS',Arial,sans-serif;color:#182d2c}canvas#world{display:block;width:100vw;height:100vh}header{position:fixed;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;gap:15px;align-items:center;pointer-events:none}.brand{font-weight:900;letter-spacing:1px;font-size:22px;color:#fff;text-shadow:0 2px #254d42}.brand small{display:block;font-size:10px;letter-spacing:2px;margin-top:5px}.stats{display:flex;align-items:center;gap:10px;background:#183e35ed;color:white;padding:10px;border-radius:12px;pointer-events:auto}.stats span{padding:0 8px;font-weight:bold}button{cursor:pointer;border:0;border-radius:7px;padding:12px 18px;background:#1d5847;color:white;font:700 15px inherit;font-family:inherit;box-shadow:0 3px 0 #102d25}button:hover{filter:brightness(1.14)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #dc9a17;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.primary{background:#e6b84e;color:#263927;box-shadow:0 3px #ae8227}.secondary{background:#e5ebe4;color:#223e32;box-shadow:0 3px #a8b9ad}aside{position:fixed;top:112px;left:20px;width:235px;padding:20px;background:#fbf9ecef;border:1px solid #ffffff;border-radius:14px;box-shadow:0 8px 28px #16423428}h2{margin:9px 0;font-size:22px}p{line-height:1.55}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:bold;color:#64806b}aside p{font-size:14px}.track{height:7px;background:#d9e1ce;border-radius:5px;overflow:hidden}#bar{height:100%;background:#c89c34;width:0}#map{display:block;margin:15px auto 8px;border:4px solid #dfdac0;border-radius:5px}aside small{font-size:10px}footer{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:20px;white-space:nowrap;background:#153a30e8;color:#e1ecdd;padding:15px 24px;border-radius:10px;font-size:12px}footer b{color:#f4ca6e;margin-right:5px}.overlay{position:fixed;inset:0;background:#0b2c2d99;display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(5px)}.overlay.hidden{display:none}#panel{background:#faf9f0;border:2px solid #e5d8b4;border-radius:20px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:34px;box-shadow:0 30px 80px #102c3266}h1{font-size:42px;letter-spacing:-1.5px;line-height:1.08;margin:14px 0}h1 em{color:#388263;font-style:normal}.tag{display:inline-block;background:#e9eddc;padding:7px 10px;border-radius:5px;font-size:12px;font-weight:bold;color:#487155}.intro-grid,.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.tile{background:#eaf0e1;border-radius:10px;padding:15px;font-size:13px;line-height:1.5}.tile b{display:block;font-size:24px;color:#26583f}label{display:block;margin:15px 0;font-weight:bold;font-size:14px}input,textarea{display:block;width:100%;padding:13px;border:1px solid #b3c6b4;border-radius:7px;margin-top:7px;font:16px inherit;font-family:inherit;background:white}textarea{min-height:90px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.answers{display:grid;gap:10px;margin:20px 0}.answers button{text-align:left;background:white;color:#294233;border:1px solid #c5d3c1;box-shadow:0 3px #dce3d5;line-height:1.45}.answers button.wrong{background:#ffe4de}.answers button.correct{background:#d6efd6}#feedback{padding:14px;border-radius:8px;line-height:1.5;background:#eeeada;min-height:50px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #d3dccd}#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#16372f;color:white;padding:12px 22px;border-radius:10px;display:none;max-width:80vw}details{font-size:13px;line-height:1.5;margin:20px 0}a{color:#29684e}.muted{font-size:13px;color:#657360}.note{background:#e9eeda;border-left:4px solid #739b57;padding:12px 18px}@media(max-width:800px){.brand{font-size:15px}header{left:10px;right:10px}.stats{gap:3px;font-size:12px}.stats button{padding:8px}.stats span{padding:0 3px}aside{width:175px;left:10px;top:100px;padding:13px}#map{width:110px;height:110px}footer{width:96%;white-space:normal;gap:9px;padding:10px;font-size:10px}#panel{padding:24px}h1{font-size:32px}}@media print{body>*{display:none!important}.overlay{display:block!important;position:static;background:white;padding:0}#panel{max-height:none;width:100%;border:0;box-shadow:none;overflow:visible}.actions{display:none}textarea{border:0}details{display:none}}

<canvas id="world" aria-label="Dunia blok isometrik Tun Perak"></canvas>
<header><div class="brand">◆ JEJAK TUN PERAK <small>DUNIA BLOK · SEJARAH TAHUN 4</small></div><div class="stats"><span id="progress">0 / 10 peti</span><span id="timer">00:00</span><button id="pauseBtn">Jeda</button><button id="noteBtn">Nota / N</button></div></header>
<aside id="mission"><span class="eyebrow">MISI PENEROKA</span><h2 id="missionTitle">Warisan Bendahara</h2><p id="clue">Cari tapak galian bercahaya.</p><div class="track"><div id="bar"></div></div><p id="digInfo">Bergerak menghampiri tanda emas.</p><canvas id="map" width="150" height="150" aria-label="Peta lokasi avatar dan tapak galian aktif"></canvas><small>Putih: anda · Emas: tapak aktif</small></aside>
<footer><span><b>WASD / ↑↓←→</b> Bergerak mengikut arah skrin</span><span><b>E / Ruang</b> Gali</span><span><b>N</b> Nota <b>P</b> Jeda</span></footer><div id="toast" role="status"></div>

<script>'use strict';
// Tanpa pustaka, fon, imej atau permintaan rangkaian luaran.
const $=id=>document.getElementById(id), canvas=$('world'),ctx=canvas.getContext('2d'),mapctx=$('map').getContext('2d');
const quests=[
{title:'Jejak keluarga',x:6,y:5,sp:'5.3.1',note:'Tun Perak berasal daripada keluarga pembesar. Bapanya ialah Bendahara Seri Wak Raja Tun Perpatih Serdang. Tun Kudu dan Tun Perpatih Putih ialah adik-beradiknya.',q:'Siapakah bapa Tun Perak?',a:['Bendahara Seri Wak Raja Tun Perpatih Serdang','Sultan Muzaffar Shah','Tun Perpatih Putih','Hang Tuah'],why:'Tun Perpatih Serdang ialah bapa Tun Perak; Tun Perpatih Putih pula ialah adik-beradiknya.'},
{title:'Dari Klang ke Melaka',x:10,y:5,sp:'5.3.1',note:'Tun Perak pernah menyandang jawatan Penghulu Klang, kemudian Penghulu Bendahari Melaka, sebelum menjadi Bendahara Melaka.',q:'Pilih urutan jawatan Tun Perak yang betul.',a:['Penghulu Klang → Penghulu Bendahari Melaka → Bendahara Melaka','Bendahara Melaka → Penghulu Klang → Penghulu Bendahari Melaka','Penghulu Klang → Sultan Melaka → Bendahara Melaka','Laksamana → Sultan Melaka → Penghulu Klang'],why:'Pengalaman beliau bermula sebagai Penghulu Klang, diikuti Penghulu Bendahari Melaka, sebelum menjadi Bendahara.'},
{title:'Anugerah istana',x:16,y:5,sp:'5.3.1',note:'Sultan Muzaffar Shah melantik Tun Perak sebagai Bendahara Melaka kerana kebijaksanaannya. Beliau menerima gelaran Bendahara Paduka Raja.',q:'Sultan manakah yang melantik Tun Perak sebagai Bendahara Melaka?',a:['Sultan Muzaffar Shah','Sultan Mahmud Shah','Sultan Alauddin Riayat Shah','Sultan Mansur Shah'],why:'Pelantikan tersebut dibuat oleh Sultan Muzaffar Shah.'},
{title:'Khidmat sepanjang hayat',x:20,y:9,sp:'5.3.1',note:'Tun Perak berkhidmat kepada empat sultan: Sultan Muzaffar Shah, Sultan Mansur Shah, Sultan Alauddin Riayat Shah dan Sultan Mahmud Shah. Beliau meninggal dunia ketika pemerintahan Sultan Mahmud Shah.',q:'Pilih cerita ringkas yang tepat tentang akhir riwayat hidup Tun Perak.',a:['Beliau berkhidmat kepada empat sultan dan meninggal dunia semasa pemerintahan Sultan Mahmud Shah.','Beliau menjadi sultan selepas berkhidmat sebagai bendahara.','Beliau hanya berkhidmat kepada seorang sultan.','Beliau meninggal dunia sebelum dilantik sebagai bendahara.'],why:'Tun Perak berkhidmat kepada empat sultan. Akhir hayatnya ialah pada zaman Sultan Mahmud Shah.'},
{title:'Pentadbiran negeri',x:17,y:12,sp:'5.3.2',note:'Sebagai ketua pembesar, Tun Perak mengurus pentadbiran atas arahan sultan, menjaga pelaksanaan undang-undang dan menjalankan tugas sultan apabila baginda gering atau ke luar negara.',q:'Sultan gering. Tun Perak mengurus tugas pentadbiran baginda. Mengapakah tindakan ini penting?',a:['Pentadbiran negeri dapat diteruskan walaupun sultan gering.','Tun Perak boleh memansuhkan semua undang-undang.','Semua pembesar boleh berhenti bertugas.','Tun Perak terus menjadi sultan baharu.'],why:'Peranan ketua pembesar memastikan urusan kerajaan berjalan ketika sultan tidak dapat menjalankan tugas.'},
{title:'Balai penasihat',x:12,y:10,sp:'5.3.2',note:'Tun Perak menasihati sultan tentang pemerintahan, termasuk pemerintahan berlandaskan ajaran Islam.',q:'Sultan meminta pandangan tentang pemerintahan yang adil. Apakah peranan Tun Perak dan kesannya?',a:['Penasihat sultan; membantu baginda membuat keputusan yang baik.','Ketua diplomat; menghentikan semua hubungan luar.','Panglima tentera; menggantikan semua pegawai istana.','Ketua pembesar; membiarkan rakyat tanpa undang-undang.'],why:'Memberi pandangan tentang pemerintahan ialah tugas penasihat sultan. Nasihat membantu sultan membuat keputusan.'},
{title:'Utusan persahabatan',x:7,y:13,sp:'5.3.2',note:'Sebagai ketua diplomat, Tun Perak mengurus hubungan luar, menyambut utusan seperti dari China dan Pasai serta menghantar rombongan persahabatan ke Siam.',q:'Tun Perak menyambut utusan China. Apakah kaitan tindakan itu dengan peranannya?',a:['Ketua diplomat; memelihara hubungan baik antara kerajaan.','Panglima tentera; memutuskan hubungan dengan kerajaan lain.','Penghulu Klang; memindahkan semua penduduk Melaka.','Penasihat sultan; menyerahkan kuasa sultan kepada utusan.'],why:'Urusan utusan dan persahabatan antara kerajaan berkaitan dengan diplomasi.'},
{title:'Benteng pertahanan',x:5,y:19,sp:'5.3.2',note:'Tun Perak juga berperanan sebagai panglima tentera. Peranan ketenteraan berkaitan dengan mempertahankan Melaka daripada ancaman musuh.',q:'Melaka diancam musuh. Mengapakah peranan panglima tentera diperlukan?',a:['Untuk mengatur pertahanan demi keselamatan Melaka.','Untuk mengurus majlis sambutan utusan sahaja.','Untuk menutup pentadbiran kerajaan selama-lamanya.','Untuk menyerahkan Melaka tanpa pertahanan.'],why:'Panglima tentera menumpukan pertahanan dan keselamatan kerajaan ketika menghadapi ancaman.'},
{title:'Undang-undang Melaka',x:12,y:20,sp:'5.3.2',note:'Ketua pembesar memastikan undang-undang dilaksanakan. Penasihat sultan memberi pandangan tentang pemerintahan. Tugas yang berbeza saling melengkapi.',q:'Jika pelaksanaan undang-undang diabaikan, apakah kesan yang munasabah dan peranan yang perlu bertindak?',a:['Ketenteraman boleh terganggu; ketua pembesar perlu memastikan undang-undang dipatuhi.','Hubungan luar pasti bertambah baik; ketua diplomat perlu menghentikan utusan.','Negeri pasti lebih aman; semua pembesar perlu berhenti bekerja.','Tiada kesan kepada negeri; panglima perlu mengabaikan keselamatan.'],why:'Penguatkuasaan undang-undang membantu menjaga ketenteraman dan merupakan sebahagian tugas ketua pembesar.'},
{title:'Warisan Bendahara',x:20,y:19,sp:'5.3.2',note:'Empat peranan utama Tun Perak ialah ketua pembesar, penasihat sultan, ketua diplomat dan panglima tentera.',q:'Apakah kesimpulan terbaik tentang sumbangan pelbagai peranan Tun Perak?',a:['Pentadbiran, nasihat, hubungan luar dan pertahanan saling menyokong kestabilan Melaka.','Kekuatan Melaka bergantung pada sambutan utusan sahaja.','Pentadbiran negeri tidak berkaitan dengan keselamatan.','Nasihat kepada sultan menjadikan undang-undang tidak diperlukan.'],why:'Gabungan peranan Tun Perak menyokong pemerintahan, hubungan baik dan keselamatan kerajaan.'}
];
let state='intro', player={x:3,y:4},index=0,digs=0,records=quests.map(()=>({tries:0,wrong:[],seconds:0})),name='',start=0,elapsed=0,paused=0,pauseAt=0,quizStart=0,keys={},last=0,walk=0,jump=0,toastUntil=0,chosenColor='#327dbe',endDate='',narrative='',analysis='';
const N=25,blocked=new Set(),trees=[],houses=[];
for(let x=1;x<N-1;x++)for(let y=1;y<N-1;y++){if((x*31+y*17)%43===0 && !quests.some(q=>Math.hypot(q.x-x,q.y-y)<2.3)&&Math.hypot(x-3,y-4)>3){trees.push({x,y});blocked.add(x+','+y)}}
for(const [x,y] of [[13,3],[14,3],[15,3],[14,2],[15,2],[4,10],[4,11],[18,16],[19,16]]){houses.push({x,y});blocked.add(x+','+y)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clock(ms){let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function total(){return state==='done'?elapsed:start?((pauseAt||performance.now())-start-paused):0}
function show(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden');keys={};setTimeout(()=>{const el=$('panel').querySelector('input,button');if(el)el.focus()},20)}
function close(){ $('overlay').classList.add('hidden');keys={}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';toastUntil=performance.now()+2800}
function intro(){show(`<span class="tag">PENGEMBARAAN LUAR TALIAN · 10 PETI</span><h1>Jejak <em>Tun Perak</em><br>Warisan dunia blok.</h1><p>Jelajahi dunia Melaka rekaan, gali tanah dan buka rahsia Bendahara terbilang. Setiap jawapan betul membuka jejak baharu.</p><div class="intro-grid"><div class="tile"><b>01</b>Ikut peta dan cahaya emas.</div><div class="tile"><b>02</b>Dekati tapak. Tekan E tiga kali untuk menggali.</div><div class="tile"><b>03</b>Jawab dengan betul untuk meneruskan penerokaan.</div></div><label>Nama murid / kumpulan<input id="playerName" maxlength="60" placeholder="Contoh: Kumpulan Hang Tuah"></label><label>Warna pakaian avatar <select id="color"><option value="#327dbe">Biru laut</option><option value="#be4e51">Merah delima</option><option value="#8053b3">Ungu</option></select></label><p class="muted">WASD / anak panah: bergerak · E / Ruang: gali · N: nota · P: jeda.<br>5.3.1 Menceritakan riwayat hidup Tun Perak.<br>5.3.2 Menganalisis peranan Tun Perak sebagai Bendahara Melaka.</p><button class="primary" id="start">Mulakan pengembaraan →</button><details><summary>Maklumat permainan dan rujukan</summary><p>Dunia blok isometrik asli, diilhamkan permainan penerokaan blok. Bukan produk rasmi Minecraft atau Roblox. Bangunan dan lokasi ialah rekaan permainan, bukan pembinaan semula sejarah. Tiada pemasangan atau internet diperlukan. Kemajuan sesi tidak disimpan apabila halaman ditutup atau dimuat semula.</p><p>Rujukan kandungan: Buku Teks Sejarah Tahun 4 SK, Unit 10, halaman bercetak 140–145. Salinan digital: <a href="https://online.anyflip.com/bcmeq/qpid/files/basic-html/page148.html" target="_blank" rel="noopener">Riwayat hidup</a> dan <a href="https://online.anyflip.com/bcmeq/qpid/files/basic-html/page150.html" target="_blank" rel="noopener">Peranan Tun Perak</a>. Pautan rujukan sahaja memerlukan internet.</p></details>`);$('start').onclick=()=>{name=$('playerName').value.trim();if(!name){$('playerName').focus();toast('Masukkan nama dahulu.');return}chosenColor=$('color').value;start=performance.now();state='explore';close();update()}}
function update(){const q=quests[index];$('progress').textContent=index+' / 10 peti';$('bar').style.width=index*10+'%';if(q){$('missionTitle').textContent=(index+1)+'. '+q.title;$('clue').textContent='Cari tanda emas pada peta. Tapak: ('+q.x+', '+q.y+').';$('digInfo').textContent='Galian: '+digs+' / 3 · Dekati tapak, tekan E.'}else{$('missionTitle').textContent='Misi selesai!';$('clue').textContent='Semua rahsia telah ditemui.';$('digInfo').textContent='Lihat rekod pentaksiran.'}}
function dig(){if(state!=='explore')return;const q=quests[index];if(Math.hypot(player.x-q.x,player.y-q.y)>1.65){toast('Dekati tapak emas dahulu. Peti lain masih terkunci.');return}digs++;jump=1;update();if(digs>=3){state='quiz';quizStart=performance.now();quiz()}else toast('Lapisan tanah '+digs+' / 3 digali.')}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function quiz(){let q=quests[index];show(`<span class="tag">PETI ${index+1} / 10 · SP ${q.sp}</span><h2>${q.title}</h2><h2 style="font-size:25px;line-height:1.35">${q.q}</h2><p class="muted">Jawab dengan betul untuk membuka peti seterusnya. Setiap pilihan dikira sebagai satu percubaan.</p><div class="answers" id="answers"></div><div id="feedback" role="status">Pilih jawapan anda.</div><div class="actions"><button id="hint" class="secondary">Baca petunjuk</button><button id="next" class="primary" hidden>Teruskan →</button></div><p id="hintText" class="note" hidden>${q.note}</p>`);shuffle(q.a.map((text,id)=>({text,id}))).forEach(a=>{let b=document.createElement('button');b.textContent=a.text;b.onclick=()=>{records[index].tries++;if(a.id===0){b.classList.add('correct');$('feedback').textContent='Betul! '+q.why;records[index].seconds=Math.round((performance.now()-quizStart)/1000);document.querySelectorAll('#answers button').forEach(b=>b.disabled=true);$('next').hidden=false;$('next').focus()}else{records[index].wrong.push(a.text);b.classList.add('wrong');b.disabled=true;$('feedback').textContent='Belum tepat. '+q.note+' Cuba pilihan lain.'}};$('answers').append(b)});$('hint').onclick=()=>{$('hintText').hidden=!$('hintText').hidden};$('next').onclick=()=>{index++;digs=0;update();if(index===quests.length){elapsed=total();endDate=new Date().toLocaleString('ms-MY');state='done';results()}else{state='explore';close();toast('Peti seterusnya telah dibuka pada peta!')}}}
function pause(note=false){if(state!=='explore')return;state='pause';pauseAt=performance.now();show(`<span class="tag">MASA DIHENTIKAN</span><h2>${note?'Catatan Bendahara':'Pengembaraan dijeda'}</h2>${note?`<p class="note">${quests[index].note}</p><p>Empat peranan: ketua pembesar, penasihat sultan, ketua diplomat dan panglima tentera.</p>`:'<p>Tekan butang di bawah untuk menyambung.</p>'}<button id="resume" class="primary">Sambung pengembaraan</button>`);$('resume').onclick=()=>{paused+=performance.now()-pauseAt;pauseAt=0;state='explore';close()}}
function results(){let first=records.filter(r=>r.tries===1).length,tries=records.reduce((s,r)=>s+r.tries,0);show(`<span class="tag">PENGEMBARAAN SELESAI · REKOD GURU</span><h1>Warisan ditemukan!</h1><p><b>${esc(name)}</b> · ${esc(endDate)}</p><div class="summary-grid"><div class="tile">Masa aktif<b>${clock(elapsed)}</b></div><div class="tile">Jumlah percubaan<b>${tries}</b></div><div class="tile">Betul kali pertama<b>${first} / 10</b></div></div><p><b>Betul selepas semua percubaan: 10 / 10.</b> Percubaan salah: ${tries-10}. Ketepatan percubaan: ${Math.round(10/tries*100)}%.</p><p class="muted">Masa aktif merangkumi penerokaan dan kuiz; jeda dan bacaan nota melalui N tidak dikira. Markah kali pertama lebih sesuai untuk mengenal pasti keperluan bimbingan. Tiada Tahap Penguasaan ditetapkan secara automatik.</p><table><thead><tr><th>Peti / Standard</th><th>Percubaan</th><th>Kali pertama</th><th>Masa kuiz</th></tr></thead><tbody>${quests.map((q,i)=>`<tr><td>${i+1}. ${q.title}<br><small>${q.sp}</small></td><td>${records[i].tries}</td><td>${records[i].tries===1?'Betul':'Belum tepat'}</td><td>${records[i].seconds}s</td></tr>`).join('')}</tbody></table><h2>Ceritakan dan analisis</h2><p class="muted">Tugasan ringkas ini melengkapkan kuiz pilihan jawapan. Guru menilai penceritaan dan alasan murid secara manual.</p><label>5.3.1 — Ceritakan riwayat hidup Tun Perak dalam 3–4 ayat.<textarea id="narrative" placeholder="Keluarga → jawatan → pelantikan → khidmat beliau">${esc(narrative)}</textarea></label><label>5.3.2 — Pilih satu peranan Tun Perak. Terangkan tindakan dan kesannya kepada Melaka.<textarea id="analysis" placeholder="Peranan … Tindakannya … Kesannya …">${esc(analysis)}</textarea></label><div class="actions"><button id="csv" class="primary">Muat turun rekod CSV</button><button id="print" class="secondary">Cetak / Simpan PDF</button><button id="again" class="secondary">Main semula</button></div><p class="muted">Simpan rekod sebelum keluar. Jawapan bertulis turut dimasukkan dalam CSV.</p>`);$('narrative').oninput=e=>narrative=e.target.value;$('analysis').oninput=e=>analysis=e.target.value;$('csv').onclick=download;$('print').onclick=()=>window.print();$('again').onclick=()=>{if(confirm('Mulakan sesi baharu? Pastikan rekod sudah dimuat turun.'))location.reload()}}
function download(){let rows=[['REKOD JEJAK TUN PERAK'],['Nama',name],['Tarikh selesai',endDate],['Masa aktif',clock(elapsed)],['Jumlah percubaan',records.reduce((s,r)=>s+r.tries,0)],['Betul kali pertama',records.filter(r=>r.tries===1).length],['Betul selepas ulang cuba',10],[],['Peti','Standard','Soalan','Jawapan betul','Bilangan percubaan','Betul kali pertama','Masa kuiz (s)','Jawapan salah']];quests.forEach((q,i)=>rows.push([i+1,q.sp,q.q,q.a[0],records[i].tries,records[i].tries===1?'Ya':'Tidak',records[i].seconds,records[i].wrong.join(' | ')]));rows.push([],['Penceritaan 5.3.1',narrative],['Analisis 5.3.2',analysis],['Catatan','Jawapan bertulis memerlukan semakan guru. Masa jeda dikecualikan.']);let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='Rekod_Tun_Perak_'+name.replace(/[^a-z0-9]/gi,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('pauseBtn').onclick=()=>pause();$('noteBtn').onclick=()=>pause(true);
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(state==='explore'){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(!e.repeat){if(e.key.toLowerCase()==='e'||e.key===' ')dig();if(e.key.toLowerCase()==='n')pause(true);if(e.key.toLowerCase()==='p')pause()}}});window.addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);window.addEventListener('blur',()=>{keys={};if(state==='explore')pause()});

window.addEventListener('keydown',e=>{if(e.key!=='Tab'||$('overlay').classList.contains('hidden'))return;let a=[...$('panel').querySelectorAll('button:not([disabled]),input,textarea,select,a[href],summary')].filter(n=>n.offsetParent!==null);if(!a.length)return;if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}});
let W=0,H=0,scale=1,camX=0,camY=0;
function resize(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);scale=Math.min(1.15,Math.max(.75,W/1300))}addEventListener('resize',resize);resize();
function iso(x,y,z=0){return {x:(x-y)*30*scale+camX,y:(x+y)*15*scale-z*scale+camY}}
function poly(p,c){ctx.fillStyle=c;ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();ctx.fill()}
function cube(x,y,z,h,top,left,right,size=1){let a=iso(x,y,z+h),b=iso(x+size,y,z+h),c=iso(x+size,y+size,z+h),d=iso(x,y+size,z+h),bb=iso(x+size,y,z),cc=iso(x+size,y+size,z),dd=iso(x,y+size,z);poly([d,c,cc,dd],left);poly([b,c,cc,bb],right);poly([a,b,c,d],top)}
function textAt(t,x,y,z,color='#fff'){let p=iso(x,y,z);ctx.font='bold 12px Trebuchet MS';ctx.textAlign='center';ctx.fillStyle='#203a32bb';ctx.fillRect(p.x-ctx.measureText(t).width/2-7,p.y-14,ctx.measureText(t).width+14,20);ctx.fillStyle=color;ctx.fillText(t,p.x,p.y)}
function pass(x,y){return x>.4&&y>.4&&x<N-1.4&&y<N-1.4&&!blocked.has(Math.round(x)+','+Math.round(y))}
function frame(t){let dt=Math.min((t-last)/1000,.04);last=t;if(state==='explore'){let sx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),sy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(sx||sy){let dx=sx+sy,dy=sy-sx,l=Math.hypot(dx,dy);dx=dx/l*3.7*dt;dy=dy/l*3.7*dt;if(pass(player.x+dx,player.y))player.x+=dx;if(pass(player.x,player.y+dy))player.y+=dy;walk+=dt*12}else walk=0}jump=Math.max(0,jump-dt*4);$('timer').textContent=clock(total());if(t>toastUntil)$('toast').style.display='none';camX=W*.58-(player.x-player.y)*30*scale;camY=H*.53-(player.x+player.y)*15*scale;
ctx.fillStyle='#91cccf';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c7e7dd';ctx.fillRect(0,H*.72,W,H*.28);
for(let sum=0;sum<N*2;sum++)for(let x=0;x<N;x++){let y=sum-x;if(y<0||y>=N)continue;let edge=x===0||y===0||x===N-1||y===N-1;let path=x===9||y===8||x===18;let qidx=quests.findIndex(q=>q.x===x&&q.y===y),depth=qidx===index?digs*4:qidx<index&&qidx>=0?12:0;cube(x,y,-18,18-depth,edge?'#5ea9b6':path?'#c9b37b':(x+y)%3?'#74a955':'#80b45c',edge?'#467d91':'#87633f',edge?'#376c83':'#705136');if(!edge&&!path&&(x*3+y)%5===0){let p=iso(x+.4,y+.4,-depth);ctx.fillStyle='#a0c26d';ctx.fillRect(p.x,p.y,4*scale,2*scale)}}
let objects=[];trees.forEach(o=>objects.push({...o,type:'tree'}));houses.forEach(o=>objects.push({...o,type:'house'}));quests.forEach((q,i)=>{if(i<=index)objects.push({...q,type:'chest',id:i})});objects.push({...player,type:'player'});objects.sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(const o of objects){if(o.type==='tree'){cube(o.x+.36,o.y+.36,0,34,'#886644','#63472f','#785536',.28);cube(o.x-.12,o.y-.12,28,27,'#40894f','#236543','#337745',1.25);cube(o.x+.1,o.y+.1,55,15,'#5a9c50','#337543','#478641',.8)}if(o.type==='house'){cube(o.x,o.y,0,40,'#bc905c','#96703f','#aa7b46');cube(o.x-.08,o.y-.08,40,13,'#b75e47','#773d36','#974435',1.16);cube(o.x+.2,o.y+.2,53,9,'#d47a52','#974435','#ae503e',.6)}if(o.type==='chest'){if(o.id<index){cube(o.x+.25,o.y+.25,-8,17,'#e5bd57','#97712e','#b28a32',.5);textAt('✓',o.x+.5,o.y+.5,25,'#fff3a1')}else if(o.id===index){let p=iso(o.x+.5,o.y+.5,0);let g=ctx.createLinearGradient(p.x,p.y-170,p.x,p.y);g.addColorStop(0,'#ffd86700');g.addColorStop(1,'#ffdf6890');ctx.fillStyle=g;ctx.fillRect(p.x-13,p.y-170,26,170);poly([iso(o.x,o.y,1),iso(o.x+1,o.y,1),iso(o.x+1,o.y+1,1),iso(o.x,o.y+1,1)],'#e0bb58');if(digs>0)cube(o.x+.2,o.y+.2,-10,7,'#9d7243','#76512e','#674729',.6);textAt('↓ GALI '+(index+1),o.x+.5,o.y+.5,48+Math.sin(t/300)*4,'#ffe295')}}if(o.type==='player'){let z=Math.sin(jump*Math.PI)*13;cube(o.x+.18,o.y+.18,z,16,'#293849','#1d293a','#253344',.45);cube(o.x+.12,o.y+.12,z+16,20,chosenColor,'#245572',chosenColor,.58);cube(o.x+.18,o.y+.18,z+36,17,'#edc18c','#b88054','#dca772',.47);cube(o.x+.16,o.y+.16,z+52,5,'#35302d','#201f20','#302727',.51);cube(o.x+.65,o.y+.3,z+15+Math.sin(walk)*3,18,'#bb9960','#836435','#a0844b',.12);cube(o.x+.51,o.y+.15,z+33,5,'#aebdc0','#627981','#80959c',.42)}}
textAt('MELAKA • BALAI BENDAHARA',14,3,90,'#ffdf90');drawMap();requestAnimationFrame(frame)}
function drawMap(){let c=mapctx,s=150/N;c.fillStyle='#75985c';c.fillRect(0,0,150,150);c.fillStyle='#c2ab75';c.fillRect(9*s,0,s,150);c.fillRect(0,8*s,150,s);c.fillStyle='#315e3b';trees.forEach(o=>c.fillRect(o.x*s,o.y*s,s,s));c.fillStyle='#80563a';houses.forEach(o=>c.fillRect(o.x*s,o.y*s,s,s));quests.forEach((q,i)=>{if(i<=index){c.fillStyle=i===index?'#ffe16d':'#355b38';c.fillRect(q.x*s,q.y*s,7,7)}});c.fillStyle='white';c.beginPath();c.arc((player.x+.5)*s,(player.y+.5)*s,3.5,0,7);c.fill()}
intro();requestAnimationFrame(frame);
